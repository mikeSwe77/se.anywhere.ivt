<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
</head>
<body>
  <div id="app">

    <header class="homey-header" style="margin-bottom: 0">
      <h1 class="homey-title">IVT Anywhere</h1>
      <p class="homey-subtitle">Sign in with your Bosch / SingleKey ID account.</p>
    </header>

    <fieldset class="homey-form-fieldset" style="margin-top: 0">

      <div class="homey-form-group">
        <label class="homey-form-label" for="serial">Heat pump serial number</label>
        <input class="homey-form-input" id="serial" type="text" placeholder="e.g. 176431053" autocomplete="off" />
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="email">Bosch / SingleKey ID email</label>
        <input class="homey-form-input" id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="password">Password</label>
        <input class="homey-form-input" id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="interval">Polling interval (seconds)</label>
        <input class="homey-form-input" id="interval" type="number" value="60" min="10" max="3600" />
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px">
        <span id="status" style="flex-grow:1; font-size:13px; color:#666"></span>
        <button id="btnConnect" class="homey-button-primary" style="margin-left:10px">Connect</button>
      </div>

    </fieldset>
  </div>

  <script>
    var statusEl = document.getElementById('status');

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.style.color = isError ? 'red' : '#666';
    }

    document.getElementById('btnConnect').addEventListener('click', function() {
      var serial   = document.getElementById('serial').value.trim();
      var email    = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var interval = parseInt(document.getElementById('interval').value, 10) || 60;
      var btn      = document.getElementById('btnConnect');

      if (!serial)   { setStatus('Please enter the serial number.', true); return; }
      if (!email)    { setStatus('Please enter your email.', true); return; }
      if (!password) { setStatus('Please enter your password.', true); return; }

      setStatus('Signing in…', false);
      btn.classList.add('is-loading');
      btn.disabled = true;

      Homey.emit('authenticate', { serial: serial, email: email, password: password, interval: interval }, function(err, device) {
        btn.classList.remove('is-loading');
        btn.disabled = false;

        if (err || !device) {
          setStatus('Error: ' + (err ? err.message : 'Unknown error'), true);
          return;
        }

        setStatus('Adding device…', false);
        Homey.createDevice(device, function(err2) {
          if (err2) { setStatus('Error adding device: ' + err2.message, true); return; }
          Homey.done();
        });
      });
    });
  </script>

  <style>
    body { padding: 0 16px 16px; }
  </style>
</body>
</html>
