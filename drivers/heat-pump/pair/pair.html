<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
</head>
<body>
  <div id="app">

    <header class="homey-header" style="margin-bottom: 0">
      <h1 class="homey-title">IVT Anywhere</h1>
      <p class="homey-subtitle">Enter the credentials printed on your heat pump.</p>
    </header>

    <fieldset class="homey-form-fieldset" style="margin-top: 0">

      <div class="homey-form-group">
        <label class="homey-form-label" for="serial">Serial number</label>
        <input class="homey-form-input" id="serial" type="text" placeholder="e.g. 176431053" autocomplete="off" />
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="key">Access key</label>
        <input class="homey-form-input" id="key" type="text" placeholder="Printed on unit label" autocomplete="off" />
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="password">Device password</label>
        <input class="homey-form-input" id="password" type="password"
               placeholder="Set via EasyControl app → Settings → Personal → Change password" autocomplete="off" />
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="interval">Polling interval (seconds)</label>
        <input class="homey-form-input" id="interval" type="number" value="60" min="10" max="3600" />
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px">
        <span id="status" style="flex-grow:1; font-size:13px; color:red"></span>
        <button id="btnConnect" class="homey-button-primary" style="margin-left:10px">Connect</button>
      </div>

    </fieldset>
  </div>

  <script>
    function setStatus(msg) {
      document.getElementById('status').textContent = msg;
    }

    document.getElementById('btnConnect').addEventListener('click', function () {
      var serial   = document.getElementById('serial').value.trim();
      var key      = document.getElementById('key').value.trim();
      var password = document.getElementById('password').value;
      var interval = parseInt(document.getElementById('interval').value, 10) || 60;
      var btn      = document.getElementById('btnConnect');

      if (!serial || !key || !password) {
        setStatus('Please fill in all fields.');
        return;
      }

      setStatus('Connecting…');
      btn.classList.add('is-loading');
      btn.disabled = true;

      Homey.emit('validate_device', { serial: serial, key: key, password: password, interval: interval }, function (err, device) {
        btn.classList.remove('is-loading');
        btn.disabled = false;

        if (err || !device) {
          setStatus('Error: ' + (err ? err.message : 'Unknown error'));
          return;
        }

        setStatus('Adding device…');
        Homey.createDevice(device, function (err2) {
          if (err2) { setStatus('Error adding device: ' + err2.message); return; }
          Homey.done();
        });
      });
    });
  </script>

  <style>
    body { padding: 0 16px 16px; }
  </style>
</body>
</html>
